name: reliability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly. This watches for contract drift on someone else's API; it is not
    # an uptime monitor, and there is no reason to generate recurring load
    # against a bootstrapped company's production API.
    - cron: "17 6 * * 1"

permissions:
  contents: read

defaults:
  run:
    # pipefail matters here: several steps pipe the CLI through `tee` into the job
    # summary, and without it tee's exit status would mask a failing check.
    shell: bash -eo pipefail {0}

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor declared in pyproject; 3.14 is what the maintainer
        # runs by default, so leaving it out meant the most-used version was the
        # one version never tested.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # pip, not uv: setup-python already provides it, and two runtime
      # dependencies do not justify adding another action to the graph.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # The unit suite mocks every HTTP call, so it never touches Evaboot.
      - run: pytest -q

  probe:
    name: live probe
    needs: test
    # Never on push. Every run of this job sends real requests to Evaboot, and a
    # merge to main has already been probed on its pull request. Pull requests,
    # manual dispatch and the weekly schedule are the only triggers that talk to
    # their API. The concurrency group above also cancels superseded runs, so
    # pushing repeatedly to a PR branch does not stack up probe runs.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      # Evaluated once here so the step below can branch on it without putting
      # the secrets context in an `if`, and without exporting the key to every
      # other step in the job.
      HAS_API_KEY: ${{ secrets.EVABOOT_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Fetch current OpenAPI document
        run: evaboot-probe schema fetch --out schemas/openapi.current.json

      - name: Diff against committed baseline
        id: diff
        # continue-on-error, not a hard failure here: a breaking change is a
        # real finding this job exists to surface, not an infrastructure fault.
        # Letting it stop the job here would skip the reliability checks and
        # webhook validation below and bury the finding in a single failed
        # step instead of a full report. The job still fails overall — see
        # "Fail if the diff found blocking changes" at the end, once every
        # other step has had a chance to run and report.
        continue-on-error: true
        run: |
          echo "## Contract diff" >> "$GITHUB_STEP_SUMMARY"
          evaboot-probe schema diff \
            --current schemas/openapi.current.json \
            --format markdown | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Reliability checks
        id: check
        # push/PR runs are GET-only. The opt-in POST to /trial/* happens on
        # manual and scheduled runs only. One invocation, so the live API is not
        # probed twice per run.
        #
        # continue-on-error, same reasoning as the diff step above: a failed
        # check (e.g. a documented response schema disappearing) is a finding
        # to report, not a reason to skip webhook validation and the
        # authenticated check that follow. Gated at the end instead.
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            TRIAL=--include-trial
          else
            TRIAL=""
          fi
          evaboot-probe check --format json $TRIAL | tee report.json
          {
            echo "## Reliability checks"
            echo '```json'
            cat report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the example webhook payload
        id: webhook
        # Validates against the committed baseline, not the live fetch, so it
        # is very unlikely to be caught up in same-day upstream drift. Still
        # continue-on-error for the same reason as the two steps above: one
        # finding must not suppress the authenticated check or the artifact
        # upload that come after it.
        continue-on-error: true
        run: evaboot-probe webhook validate docs/webhook-example.json

      - name: Authenticated checks
        if: env.HAS_API_KEY == 'true'
        env:
          EVABOOT_API_KEY: ${{ secrets.EVABOOT_API_KEY }}
        # A missing Sales Navigator seat or an exhausted daily quota warns rather
        # than fails, but a rejected key does fail; keep that out of the required
        # signal for forks and contributors.
        continue-on-error: true
        run: evaboot-probe check --format markdown | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reliability-report
          path: |
            report.json
            schemas/openapi.current.json
          if-no-files-found: warn

      - name: Fail if any check found a real problem
        # Placed last on purpose: the diff, the checks and the webhook
        # validation all run with continue-on-error, so every one of them has
        # already reported its findings (job summary, artifact) by the time
        # this can fail the job. `outcome` reports each step's real result
        # even though continue-on-error reported "success" to the steps after
        # it. The authenticated step is deliberately excluded: a missing or
        # rejected EVABOOT_API_KEY must not fail CI for forks and outside
        # contributors, which is also why it stays continue-on-error above.
        #
        # GitHub Actions expressions (${{ }}) are expanded before the shell
        # runs, and there is no dynamic `steps[name]` lookup, so each outcome
        # is passed in by name via env rather than looped over.
        if: always()
        env:
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          WEBHOOK_OUTCOME: ${{ steps.webhook.outcome }}
        run: |
          failed=""
          [ "$DIFF_OUTCOME" = "failure" ] && failed="$failed diff"
          [ "$CHECK_OUTCOME" = "failure" ] && failed="$failed check"
          [ "$WEBHOOK_OUTCOME" = "failure" ] && failed="$failed webhook"
          if [ -n "$failed" ]; then
            echo "::error::Failing step(s):$failed. See their output and the job summary above."
            exit 1
          fi
