[project]
name = "evaboot-probe"
version = "0.1.0"
description = "Black-box reliability and contract probe for the Evaboot public API"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
evaboot-probe = "evaboot_probe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaboot_probe"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
